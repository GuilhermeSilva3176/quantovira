<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: linear-gradient(135deg, #14213d 0%, #1a2d52 55%, #0f9d76 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 72px 80px;
  }
  .mark { display: flex; align-items: center; gap: 20px; margin-bottom: 28px; }
  .mark svg { flex-shrink: 0; }
  h1 { font-size: 64px; font-weight: 800; letter-spacing: -0.02em; }
  h1 span { color: #5ee0b5; }
  p { font-size: 32px; max-width: 900px; line-height: 1.35; color: #e8ecf4; margin-top: 8px; }
  .url { margin-top: 40px; font-size: 26px; color: #5ee0b5; font-weight: 700; }
</style>
</head>
<body>
  <div class="mark">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="72" height="72"><rect width="32" height="32" rx="8" fill="#fff" fill-opacity=".12"/><path fill="#5ee0b5" d="M8 22V10h3.2l3.4 7.2L18 10h3.2v12h-2.6v-7.1L15.2 22h-2.1l-3.4-7.1V22H8z"/><circle cx="24" cy="12" r="2.2" fill="#0f9d76"/></svg>
    <h1>Quanto<span>Vira</span></h1>
  </div>
  <p>Calculadoras financeiras gratuitas com dados reais do Brasil — FIRE, PJ x CLT e IR.</p>
  <div class="url">quantovira.com.br</div>
</body>
</html>
