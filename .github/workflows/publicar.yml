name: Publicar artigos

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'scripts/**'
      - '.github/workflows/publicar.yml'

permissions:
  contents: write

concurrency:
  group: publicar-artigos
  cancel-in-progress: false

jobs:
  publicar:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Fontes e Chrome
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core
      - name: Instalar Chrome
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        with:
          install-dependencies: true

      - name: Gerar páginas e imagens OG
        env:
          CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run build

      - name: Commit das páginas geradas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma página nova."
            exit 0
          fi
          git commit -m "Publica artigos gerados [skip ci]"
          git push origin HEAD:main
