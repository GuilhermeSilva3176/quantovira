name: Verificar

on:
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fontes e Chrome
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core
      - uses: browser-actions/setup-chrome@v1

      - name: Gerar artigos e imagens OG
        run: npm run build

      - name: Testes
        run: npm test
